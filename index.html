<!DOCTYPE html>

    <title>My GitHub Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 30px 15px;
            text-align: center;
        }

        h1 {
            margin-bottom: 15px;
        }

        p {
            line-height: 1.6;
        }

        /* Adsterra Ad Container */
        .ad-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 10px;
            overflow: hidden;
        }

        .ad-box {
            width: 300px;
            max-width: 100%;
            min-height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ad-box iframe {
            max-width: 100%;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 10px;
            }

            .ad-container {
                padding: 20px 5px;
            }
        }
    </style>
</head>
